<div class="grid">
  @for (c of cards; track c.slug) {
    @if ((!c.managerOnly || canManageUsers()) && (!c.superAdminOnly || isSuperAdmin())) {
      <a class="card" [routerLink]="c.slug">
        <span class="icon">
          <svg viewBox="0 0 24 24" width="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10" /></svg>
        </span>
        <span class="body">
          <b>{{ c.label }}</b>
          <span class="desc">{{ c.description }}</span>
        </span>
        <span class="chev">
          <svg viewBox="0 0 24 24" width="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 6-6 6 6 6" /></svg>
        </span>
      </a>
    }
  }
</div>
