<div class="home">
  <!-- خلفية متحركة -->
  <div class="bg-glow"></div>
  <div class="bg-rings"></div>
  <div class="particles" aria-hidden="true">
    @for (p of particles; track p) {
      <i class="pt"></i>
    }
  </div>

  <!-- الشريط العلوي -->
  <header class="topbar reveal">
    <div class="brand">
      <span class="brand-mark">◈</span>
      <div class="brand-txt">
        <b><span>Smart</span>Invest</b>
        <small>محافظة المنوفية</small>
      </div>
    </div>
  </header>

  <!-- المحتوى المركزي -->
  <main class="hero">
    <div class="stage-wrap">
      <div class="stage">
        <!-- الحلقة المتوهجة خلف الشعار -->
        <div class="emblem-ring"></div>
        <div class="emblem-halo"></div>

        <!-- الشعار المرسوم -->
        <div class="emblem">
          <svg viewBox="0 0 200 200" class="emblem-svg" role="img" aria-label="شعار محافظة المنوفية">
            <defs>
              <radialGradient id="discGrad" cx="35%" cy="28%" r="80%">
                <stop offset="0%" stop-color="#7BCE72" />
                <stop offset="55%" stop-color="#4CAF50" />
                <stop offset="100%" stop-color="#2B7A34" />
              </radialGradient>
              <linearGradient id="towerGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#FFFFFF" />
                <stop offset="100%" stop-color="#E4EBE6" />
              </linearGradient>
              <linearGradient id="flameGrad" x1="0" y1="1" x2=".2" y2="0">
                <stop offset="0%" stop-color="#C1272D" />
                <stop offset="100%" stop-color="#FFA726" />
              </linearGradient>
              <linearGradient id="wheatGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#F4C95D" />
                <stop offset="100%" stop-color="#D9861F" />
              </linearGradient>
              <linearGradient id="gearGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#5B9BD8" />
                <stop offset="100%" stop-color="#2D6BA6" />
              </linearGradient>
            </defs>

            <!-- القرص الأخضر -->
            <circle cx="100" cy="100" r="96" fill="url(#discGrad)" stroke="#1B5E20" stroke-width="3" />
            <circle cx="100" cy="100" r="89.5" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="1.4" />

            <!-- سنبلة القمح اليمين -->
            <g class="wheat" fill="none" stroke="url(#wheatGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M148 158 C168 138 174 106 160 74 C154 61 145 51 134 44" />
              <path d="M148 158 l14 8 M144 148 l16 4 M139 137 l17 1 M135 126 l17 -2 M132 115 l16 -5 M129 104 l15 -8 M126 93 l14 -9 M137 79 l13 -6 M133 68 l12 -8 M134 58 l10 -10 M134 44 l7 -12" />
            </g>
            <!-- سنبلة القمح الشمال (انعكاس) -->
            <g class="wheat" fill="none" stroke="url(#wheatGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" transform="scale(-1,1) translate(-200,0)">
              <path d="M148 158 C168 138 174 106 160 74 C154 61 145 51 134 44" />
              <path d="M148 158 l14 8 M144 148 l16 4 M139 137 l17 1 M135 126 l17 -2 M132 115 l16 -5 M129 104 l15 -8 M126 93 l14 -9 M137 79 l13 -6 M133 68 l12 -8 M134 58 l10 -10 M134 44 l7 -12" />
            </g>

            <!-- الترس -->
            <g class="gear" transform="translate(100,171)">
              <g fill="url(#gearGrad)">
                @for (t of gearTeeth; track t) {
                  <rect x="-6.5" y="-34" width="13" height="12" rx="2" [attr.transform]="'rotate(' + t + ')'" />
                }
              </g>
              <circle r="27" fill="url(#gearGrad)" stroke="#1B4A78" stroke-width="1.5" />
              <circle r="11.5" fill="#0E2338" />
            </g>

            <!-- اللهب -->
            <g class="flames">
              <path fill="url(#flameGrad)" d="M100 150 C90 142 85 130 90 118 C92 128 96 132 98 126 C100 136 106 140 100 150 Z" />
              <path fill="url(#flameGrad)" d="M78 148 C64 142 58 128 66 112 C67 124 74 130 76 122 C82 132 88 138 78 148 Z" />
              <path fill="url(#flameGrad)" d="M122 148 C136 142 142 128 134 112 C133 124 126 130 124 122 C118 132 112 138 122 148 Z" />
            </g>

            <!-- البرج -->
            <path class="tower" fill="url(#towerGrad)" stroke="#B9C4BE" stroke-width="1.5"
              d="M88 40 C88 34 112 34 112 40 L118 130 C119 138 112 144 100 144 C88 144 81 138 82 130 Z" />

            <!-- خطوط زرقاء أعلى البرج -->
            <g class="tower-ticks" stroke="#2D6BA6" stroke-width="2.6" stroke-linecap="round">
              <path d="M84 52 l-7 -6" /><path d="M83 62 l-8 -5" />
              <path d="M116 52 l7 -6" /><path d="M117 62 l8 -5" />
            </g>

            <!-- الفتحات -->
            <g class="portholes" fill="#DCEFFB" stroke="#2D6BA6" stroke-width="2.2">
              <circle cx="100" cy="68" r="4.4" />
              <circle cx="91" cy="78" r="4.4" /><circle cx="109" cy="78" r="4.4" />
              <circle cx="91" cy="92" r="4.4" /><circle cx="109" cy="92" r="4.4" />
              <circle cx="95" cy="106" r="4.4" /><circle cx="105" cy="106" r="4.4" />
            </g>

            <!-- الحمام الواقف على البرج -->
            <g class="doves-perch" [class.away]="takingFlight()">
              <g transform="translate(76,38) scale(.9)"><use href="#doveRest" /></g>
              <g transform="translate(100,30) scale(1.05)"><use href="#doveRest" /></g>
              <g transform="translate(123,39) scale(.85) scale(-1,1)"><use href="#doveRest" /></g>
            </g>

            <defs>
              <g id="doveRest">
                <path d="M-7 2 C-9 -4 -5 -10 2 -11 C8 -12 12 -8 11 -3 C10 1 5 3 0 2 C-3 1 -5 1 -7 2 Z" fill="#FFFFFF" />
                <path d="M-7 -1 L-13 -3 L-7 -5 Z" fill="#F1F1F1" />
                <circle cx="9" cy="-8" r="2.1" fill="#FFFFFF" />
                <path d="M11 -8.5 l4 -1 l-3.2 2.4 z" fill="#D9861F" />
                <circle cx="9.6" cy="-8.4" r=".55" fill="#12331F" />
              </g>
            </defs>
          </svg>

          <!-- حمام الطيران عند نجاح الدخول -->
          <div class="doves-fly" [class.active]="takingFlight()" aria-hidden="true">
            <svg class="dove df-1" viewBox="0 0 64 48"><g class="dove-inner">
              <path d="M8 30 C14 22 24 20 34 24 C40 26 46 24 52 18 C50 26 44 32 36 33 L44 40 L34 38 L30 44 L27 36 C18 37 11 35 8 30 Z" fill="#ffffff" />
              <circle cx="49" cy="18" r="2.4" fill="#ffffff" /><path d="M53 17 l5 -1 l-4 3 z" fill="#D9861F" /><circle cx="50" cy="17.4" r=".7" fill="#12331F" />
              <path class="wing wing-up" d="M24 24 C28 12 40 10 48 14 C40 18 34 22 30 27 Z" fill="#eef6ef" />
              <path class="wing wing-down" d="M22 26 C26 34 38 38 46 36 C38 30 32 28 28 25 Z" fill="#dfeede" />
            </g></svg>
            <svg class="dove df-2" viewBox="0 0 64 48"><g class="dove-inner">
              <path d="M8 30 C14 22 24 20 34 24 C40 26 46 24 52 18 C50 26 44 32 36 33 L44 40 L34 38 L30 44 L27 36 C18 37 11 35 8 30 Z" fill="#ffffff" />
              <circle cx="49" cy="18" r="2.4" fill="#ffffff" /><path d="M53 17 l5 -1 l-4 3 z" fill="#D9861F" /><circle cx="50" cy="17.4" r=".7" fill="#12331F" />
              <path class="wing wing-up" d="M24 24 C28 12 40 10 48 14 C40 18 34 22 30 27 Z" fill="#eef6ef" />
              <path class="wing wing-down" d="M22 26 C26 34 38 38 46 36 C38 30 32 28 28 25 Z" fill="#dfeede" />
            </g></svg>
            <svg class="dove df-3" viewBox="0 0 64 48"><g class="dove-inner">
              <path d="M8 30 C14 22 24 20 34 24 C40 26 46 24 52 18 C50 26 44 32 36 33 L44 40 L34 38 L30 44 L27 36 C18 37 11 35 8 30 Z" fill="#ffffff" />
              <circle cx="49" cy="18" r="2.4" fill="#ffffff" /><path d="M53 17 l5 -1 l-4 3 z" fill="#D9861F" /><circle cx="50" cy="17.4" r=".7" fill="#12331F" />
              <path class="wing wing-up" d="M24 24 C28 12 40 10 48 14 C40 18 34 22 30 27 Z" fill="#eef6ef" />
              <path class="wing wing-down" d="M22 26 C26 34 38 38 46 36 C38 30 32 28 28 25 Z" fill="#dfeede" />
            </g></svg>
          </div>
        </div>
      </div>
    </div>

    <!-- العناوين -->
    <div class="titles">
      <p class="rep reveal d1">الجمهورية العربية المصرية</p>
      <h1 class="gov reveal d2">محافظة المنوفية</h1>
      <div class="divider reveal d3"></div>
      <p class="sys reveal d4">نظام إدارة الاستثمار والمشروعات</p>
      <p class="phase reveal d5">المرحلة الأولى · إدارة التخطيط</p>
    </div>

    <!-- نموذج تسجيل الدخول -->
    <div class="lcard reveal d6">
      @if (error()) {
        <div class="alert">{{ error() }}</div>
      }

      <form (ngSubmit)="submit()">
        <div class="lfield">
          <label>البريد الإلكتروني أو اسم المستخدم</label>
          <div class="box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="5" width="18" height="14" rx="2" /><path d="m3 7 9 6 9-6" />
            </svg>
            <input
              type="text"
              autocomplete="username"
              placeholder="example@menoufia.gov.eg"
              [ngModel]="usernameOrEmail()"
              (ngModelChange)="usernameOrEmail.set($event)"
              name="usernameOrEmail"
            />
          </div>
        </div>

        <div class="lfield">
          <label>كلمة المرور</label>
          <div class="box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="4" y="10" width="16" height="10" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3" />
            </svg>
            <input
              [type]="showPassword() ? 'text' : 'password'"
              autocomplete="current-password"
              placeholder="••••••••"
              [ngModel]="password()"
              (ngModelChange)="password.set($event)"
              name="password"
            />
            <button type="button" class="eye" (click)="showPassword.set(!showPassword())" aria-label="إظهار كلمة المرور">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" /><circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="lbtn" [disabled]="loading() || takingFlight()">
          @if (loading()) {
            <span class="spinner"></span> جاري الدخول…
          } @else if (takingFlight()) {
            تم الدخول…
          } @else {
            <svg viewBox="0 0 24 24" width="17" fill="none" stroke="currentColor" stroke-width="1.9">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3" />
            </svg>
            تسجيل الدخول
          }
        </button>
      </form>
    </div>
  </main>

  <footer class="foot reveal d6">© 2026 محافظة المنوفية — نظام SmartInvest · جميع الحقوق محفوظة</footer>
</div>
