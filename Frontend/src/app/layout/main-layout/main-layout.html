<div class="shell">
  <button
    class="side-toggle"
    [class.collapsed]="sidebarCollapsed()"
    [style.right.px]="sidebarCollapsed() ? 8 : 250"
    (click)="toggleSidebar()"
    [attr.aria-label]="sidebarCollapsed() ? 'إظهار القائمة الجانبية' : 'إخفاء القائمة الجانبية'"
    [attr.aria-expanded]="!sidebarCollapsed()"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 6-6 6 6 6" /></svg>
  </button>

  <!-- الشريط الجانبي على اليمين (الأول في الـ DOM = يمين في RTL) -->
  <aside class="side" [class.collapsed]="sidebarCollapsed()">
    <div class="logo">
      <div class="mark">
        <svg viewBox="0 0 24 24" width="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" /></svg>
      </div>
      <div class="logo-txt">
        <b>{{ user()?.fullName }}</b>
        <span>{{ roleLabel() }}</span>
      </div>
    </div>

    <div class="sec">القائمة الرئيسية</div>
    <nav class="nav-list">
      @for (item of nav(); track item.route) {
        <a class="nav" [routerLink]="item.route" routerLinkActive="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path [attr.d]="item.icon" />
          </svg>
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="sec">المرحلة الحالية</div>
    <div class="phase">المرحلة الأولى — إدارة التخطيط</div>

    <div class="grow"></div>

    <div class="me">
      <div class="av">{{ initial() }}</div>
      <div class="me-txt">
        <b>{{ user()?.fullName }}</b>
        <span>{{ roleLabel() }}</span>
      </div>
    </div>
    <button class="logout" (click)="logout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" />
      </svg>
      تسجيل الخروج
    </button>
  </aside>

  <!-- المحتوى -->
  <div class="content">
    <router-outlet />
  </div>
</div>
