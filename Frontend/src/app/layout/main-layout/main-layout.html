<div class="shell">
  <button
    class="side-toggle"
    [class.collapsed]="sidebarCollapsed()"
    [style.right.px]="sidebarCollapsed() ? 8 : 274"
    (click)="toggleSidebar()"
    [attr.aria-label]="sidebarCollapsed() ? 'إظهار القائمة الجانبية' : 'إخفاء القائمة الجانبية'"
    [attr.aria-expanded]="!sidebarCollapsed()"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="m15 6-6 6 6 6" />
    </svg>
  </button>

  <button
    class="mobile-menu-btn"
    type="button"
    (click)="toggleMobileNav()"
    aria-label="فتح القائمة الجانبية"
    [attr.aria-expanded]="mobileNavOpen()"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M4 7h16M4 12h16M4 17h16" />
    </svg>
  </button>

  @if (mobileNavOpen()) {
    <div class="mobile-backdrop" (click)="closeMobileNav()"></div>
  }

  <!-- الشريط الجانبي على اليمين (الأول في الـ DOM = يمين في RTL) -->
  <aside class="side" [class.collapsed]="sidebarCollapsed()" [class.mobile-open]="mobileNavOpen()">
    <div class="brand">
      <img class="brand-mark" src="/Menoufia-Logo.png" alt="شعار محافظة المنوفية" />
      <div class="brand-txt">
        <b>SmartInvest</b>
        <span>محافظة المنوفية</span>
      </div>
    </div>

    <div class="sec">القائمة الرئيسية</div>
    <nav class="nav-list">
      @for (item of nav(); track item.route) {
        <a
          class="nav"
          [routerLink]="item.route"
          routerLinkActive="active"
          (click)="closeMobileNav()"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path [attr.d]="item.icon" />
          </svg>
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="grow"></div>

    <div class="theme-slot">
      <app-theme-toggle />
    </div>

    <a
      class="me"
      routerLink="/app/profile"
      routerLinkActive="profile-active"
      (click)="closeMobileNav()"
      aria-label="فتح الملف الشخصي"
    >
      <span class="av si-avatar">
        @if (avatarUrl()) {
          <img [src]="avatarUrl()" alt="" />
        } @else {
          {{ initial() }}
        }
      </span>
      <div class="me-txt">
        <b>{{ user()?.fullName }}</b>
        <span>{{ roleLabel() }}</span>
      </div>
      <svg class="me-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m9 18 6-6-6-6" />
      </svg>
    </a>
    <button class="logout" (click)="logout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" />
      </svg>
      تسجيل الخروج
    </button>
  </aside>

  <!-- المحتوى -->
  <div class="content">
    <router-outlet />
  </div>
  <app-toast-host />
</div>
